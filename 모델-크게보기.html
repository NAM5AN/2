<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몰볼 모델과 사람 크게 보기</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ec;color:#203137;font-family:"Malgun Gothic",sans-serif}header{max-width:1900px;margin:18px auto;padding:0 20px}h1{font-size:22px;margin:10px 0;word-break:keep-all}p{font-size:13px;line-height:1.7;color:#35627d}a{color:#27624a;text-underline-offset:3px}.large-stage{position:relative;width:calc(100% - 24px);max-width:1900px;margin:0 auto 24px;background:white;box-shadow:0 0 0 1px #dce3dd}.large-model{display:block;width:100%;height:auto}.large-person{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}[hidden]{display:none!important}</style></head><body><header><a href="몰볼-통합-UV-대조.html">대조 화면으로 돌아가기</a><h1 id="view-title">사람과 모델 크게 보기</h1><p id="view-status" role="status">이미지를 준비하고 있습니다.</p></header><main class="large-stage" data-ready="false" hidden><img class="large-model" alt="몰볼 모델"><img class="large-person" alt="164cm 기준 임시 인체 위치"></main><script>'use strict';(async()=>{const params=new URLSearchParams(location.search),modelFile=params.get('model')||'',personFile=params.get('person')||'',match=/^model-(body|full|tentacles|long|medium|small|head(?:-0[1-5])?)-(front|rear|bottom)-(uv|actual)-(labels|plain)(?:-wire)?\.webp$/.exec(modelFile),status=document.getElementById('view-status'),stage=document.querySelector('.large-stage');if(!match||personFile!=='person-'+match[1]+'-'+match[2]+'.webp'){status.textContent='대조 화면에서 사람과 모델 크게 보기를 눌러 주세요.';return;}const title=params.get('title')||'사람과 모델';document.getElementById('view-title').textContent=title+' · '+({front:'앞쪽',rear:'뒤쪽',bottom:'아래쪽'}[match[2]]);document.title=title+' · 사람과 모델 크게 보기';const model=document.querySelector('.large-model'),person=document.querySelector('.large-person');model.src=modelFile;person.src=personFile;try{await Promise.all([model.decode(),person.decode()]);if(model.naturalWidth!==person.naturalWidth||model.naturalHeight!==person.naturalHeight)throw new Error('Image sizes differ');stage.hidden=false;stage.dataset.ready='true';status.textContent='파란 인체는 164cm 기준의 임시 체형이며, 내부 위치를 보이도록 겹쳐 표시합니다.';}catch(error){status.textContent='이미지를 불러오지 못했습니다. 대조 화면과 이미지 파일이 같은 폴더에 있는지 확인해 주세요.';stage.dataset.ready='error';}})();</script></body></html>
