name: Publish R01 working files
on:
  push:
    branches: [publish/r01-package]
    paths: ['.github/workflows/publish-r01.yml', '.r01-transfer/restore.py', '.r01-transfer/corrections.json', '.r01-transfer/manifest.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install decompressor
        run: python -m pip install zstandard==0.25.0
      - name: Restore, validate and push clean ready branch
        run: python .r01-transfer/restore.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r01-publication-result
          path: |
            publication-output/
            .r01-transfer/
          include-hidden-files: true
          retention-days: 7
