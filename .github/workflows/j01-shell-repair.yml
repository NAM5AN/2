name: J01 independent shell repair
on:
  push:
    branches: [repair/j01-independent-shells]
    paths: ['tools/j01-shell-repair.py']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native geometry runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1
          python -m pip install bpy numpy scipy tetgenpy==0.1.0
      - name: Reconstruct, validate and save independent shells
        run: python tools/j01-shell-repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morbol-independent-shells-v24
          path: repair-output/final/
          retention-days: 14
