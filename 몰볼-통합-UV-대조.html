<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몰볼 · 모델 버전과 UV 대조</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic",Arial,sans-serif;color:#243b35;background:#f4f6f0;display:flex;flex-direction:column}
.version-bar{flex:none;padding:12px 24px 10px;border-bottom:1px solid #ced9cc;background:#fff;box-shadow:0 2px 8px #243b3508;z-index:2}
.version-row{display:flex;align-items:center;gap:14px;max-width:1700px;margin:auto}.version-label{font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.version-tabs{display:flex;gap:4px;background:#edf2e9;padding:4px;border-radius:10px}
.version-tabs button{border:0;border-radius:7px;padding:10px 17px;background:transparent;color:#4f6458;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.version-tabs button[aria-selected=true]{background:#3d5843;color:#fff;box-shadow:0 1px 3px #1b342022}.version-tabs button:focus-visible{outline:3px solid #3684b2;outline-offset:2px}
.version-note{font-size:11px;color:#627568;line-height:1.6;margin-left:auto;word-break:keep-all}
.version-stage{flex:1;min-height:0;position:relative}.version-panel{position:absolute;inset:0}.version-panel[hidden]{display:block;visibility:hidden;pointer-events:none}iframe{border:0;width:100%;height:100%;display:block;background:#f4f6f0}
.version-loading{position:absolute;inset:20px 20px auto;background:#fff;padding:14px;border-radius:8px;text-align:center;color:#627568;font-size:13px}.version-loading[hidden]{display:none}
noscript{padding:20px}noscript a{margin:10px;color:#3d5843}
@media(max-width:700px){.version-bar{padding:9px 12px}.version-row{flex-wrap:wrap;gap:6px 10px}.version-label{font-size:11px}.version-tabs{flex:1}.version-tabs button{flex:1;font-size:12px;padding:9px 10px}.version-note{width:100%;margin:0;font-size:10px}}
</style>
</head>
<body>
<div class="version-bar">
 <div class="version-row">
  <span class="version-label">모델 버전</span>
  <div class="version-tabs" role="tablist" aria-label="모델 버전 선택">
   <button id="tab-complete" role="tab" aria-controls="panel-complete" aria-selected="true" tabindex="0" data-version="complete">버전 1 · 마감 포함</button>
   <button id="tab-shell" role="tab" aria-controls="panel-shell" aria-selected="false" tabindex="-1" data-version="shell">버전 2 · 외피만</button>
  </div>
  <span class="version-note" id="version-note" aria-live="polite">외피 틈 연결 · 내부 마감면 포함</span>
 </div>
</div>
<div class="version-stage">
<section class="version-panel" id="panel-complete" role="tabpanel" aria-labelledby="tab-complete">
 <div class="version-loading" role="status" hidden>기존 모델과 UV를 불러오는 중입니다.</div>
 <iframe title="버전 1 · 마감 포함 모델과 UV 대조" data-src="model-complete.html?rev=repair28-20261006" allow="fullscreen"></iframe>
</section>
<section class="version-panel" id="panel-shell" role="tabpanel" aria-labelledby="tab-shell" hidden>
 <div class="version-loading" role="status" hidden>외피 모델과 UV를 불러오는 중입니다.</div>
 <iframe title="버전 2 · 외피만 있는 모델과 UV 대조" data-src="model-shell.html?rev=repair28-20261006" allow="fullscreen"></iframe>
</section>
</div>
<noscript>자바스크립트를 켜거나 직접 열어 주세요. <a href="model-complete.html">버전 1</a><a href="model-shell.html">버전 2</a></noscript>
<script>
(()=>{'use strict';
 const tabs=[...document.querySelectorAll('[role=tab]')], notes={complete:'외피 틈 연결 · 내부 마감면 포함',shell:'외피 틈 연결 · 내부 마감판 없는 버전'};
 function show(version,updateURL=true){
  if(!Object.hasOwn(notes,version))version='complete';
  for(const tab of tabs){const active=tab.dataset.version===version;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;
   const panel=document.getElementById(tab.getAttribute('aria-controls'));panel.hidden=!active;panel.inert=!active;
   if(active){const frame=panel.querySelector('iframe'),loading=panel.querySelector('[role=status]');
    if(!frame.hasAttribute('src')){loading.hidden=false;frame.addEventListener('load',()=>loading.hidden=true,{once:true});frame.src=frame.dataset.src;}
   }
  }
  document.getElementById('version-note').textContent=notes[version];document.body.dataset.version=version;
  if(updateURL){const url=new URL(location.href);url.searchParams.set('version',version==='shell'?'2':'1');history.replaceState(null,'',url);}
 }
 tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>show(tab.dataset.version));tab.addEventListener('keydown',event=>{
  const target=event.key==='Home'?0:event.key==='End'?tabs.length-1:event.key==='ArrowRight'?(index+1)%tabs.length:event.key==='ArrowLeft'?(index+tabs.length-1)%tabs.length:null;
  if(target!==null){event.preventDefault();tabs[target].focus();show(tabs[target].dataset.version);}
 });});
 addEventListener('popstate',()=>show(new URLSearchParams(location.search).get('version')==='2'?'shell':'complete',false));
 show(new URLSearchParams(location.search).get('version')==='2'?'shell':'complete',false);
})();
</script>
</body></html>
